name: Scientific checks

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - 'data/benchmarks/1iep/**'
      - 'pyproject.toml'
      - '.github/workflows/scientific-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  tests:
    name: Real tool tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the pinned scientific stack and official Vina
        run: |
          python -m pip install -e '.[test,ui]'
          python scripts/install_vina.py
          python -c "import os,pathlib; p=pathlib.Path('tools').resolve(); open(os.environ['GITHUB_PATH'],'a',encoding='utf-8').write(str(p)+'\n')"
      - name: Verify the actual environment
        run: |
          mkdir -p ci-evidence
          python -m pip check
          dockpipe check > ci-evidence/environment.json
          python -m pip freeze > ci-evidence/requirements.txt
      - name: Run unit, UI, and real scientific integration tests
        run: python -m pytest -m 'not benchmark' --junitxml=ci-evidence/tests.xml -ra
      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: ci-evidence/
          retention-days: 14

  redocking:
    name: Real 1IEP redocking (Linux)
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install scientific tools
        run: |
          python -m pip install -e '.[test,ui]'
          python scripts/install_vina.py
          echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
      - name: Redock the experimental ligand with real Vina
        run: dockpipe benchmark --id 1iep --job ci-1iep --cpu 2 --exhaustiveness 32
      - name: Independently recompute saved crystallographic RMSD
        env:
          DOCKPIPE_BENCHMARK_JOB: ${{ github.workspace }}/results/ci-1iep
        run: python -m pytest -m benchmark --junitxml=results/benchmark-tests.xml -ra
      - name: Preserve raw scores, poses, preparation logs and validation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-1iep-redocking
          path: results/
          retention-days: 30
